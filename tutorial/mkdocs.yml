site_name: Building Zendo
site_description: A hands-on tutorial for building a multi-tenant retreat center platform with the Lotus tech stack
site_author: Zendo Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
  icon:
    logo: material/meditation

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - def_list

plugins:
  - search
  - glightbox

nav:
  - Home: index.md
  - "1. Get the Page Running": section-01-get-running.md
  - "2. Multi-Tenancy from Day One": section-02-multi-tenancy.md
  - "3. Users, Roles & Auth": section-03-auth.md
  - "4. Feature Flags with Pennant": section-04-feature-flags.md
  - "5. Admin Panel with Filament": section-05-filament.md
  - "6. The Public Hub — Inertia + React": section-06-inertia-hub.md
  - "7. Events, Queues & Realtime": section-07-queues-realtime.md
  - "8. The Registration Wizard": section-08-registration-wizard.md
  - "9. Payments with Stripe": section-09-payments.md
  - "10. Search with Meilisearch": section-10-search.md
  - "11. Testing with Pest": section-11-testing.md
  - "12. Observability": section-12-observability.md
  - "13. Hardening — RLS & Security": section-13-hardening.md
  - "14. Deployment": section-14-deployment.md